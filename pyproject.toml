[project]
name = "rp2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"language-tool-python>=2.9.4",
	"matplotlib>=3.10.6",
	"pip>=25.2",
	"polars[all]>=1.32.3",
	"scikit-learn>=1.7.1",
	"spacy[lookups,transformers]>=3.8.7",
	"torch==2.9.0",
	"torchvision==0.24.0",
	"torchaudio==2.9.0",
	"transformers[torch]>=4.49.0",
	"markupsafe",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }
markupsafe = { index = "pypi" }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

